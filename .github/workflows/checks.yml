name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_repository.py
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/safeoff-wheel
          /tmp/safeoff-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/safeoff-wheel/bin/safeoff --help
          /tmp/safeoff-wheel/bin/safeoff generate --help
  tests:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      WANDB_MODE: disabled
      WANDB_DISABLED: "true"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
